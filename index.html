<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para ti 💌</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:
        radial-gradient(circle at 20% 20%,rgba(255,255,255,.8),transparent 28%),
        linear-gradient(135deg,#dff6ff,#fff3e8);
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Georgia,serif;
}

/* Fondo */
.fondo{
    position:fixed;
    inset:0;
    pointer-events:none;
}

/* SOBRE */
.escena{
    width:100%;
    height:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
}

.sobre{
    width:300px;
    height:190px;
    position:relative;
    cursor:pointer;
    animation:flotar 3s ease-in-out infinite;
    transition:opacity .7s,transform .7s;
}

.cuerpo{
    position:absolute;
    inset:0;
    background:linear-gradient(145deg,#fffaf7,#efd3d3);
    border-radius:6px;
    box-shadow:0 20px 40px rgba(0,0,0,.2);
    overflow:hidden;
}

.cuerpo:after{
    content:"";
    position:absolute;
    left:0;
    bottom:0;
    width:0;
    height:0;
    border-left:150px solid transparent;
    border-right:150px solid transparent;
    border-bottom:105px solid #e7c2c4;
}

.tapa{
    position:absolute;
    left:0;
    top:0;
    width:0;
    height:0;
    border-left:150px solid transparent;
    border-right:150px solid transparent;
    border-top:105px solid #f3d7d7;
    transform-origin:top center;
    transition:transform 1s ease;
    z-index:5;
}

.corazon{
    position:absolute;
    z-index:8;
    left:50%;
    top:54%;
    transform:translate(-50%,-50%);
    font-size:43px;
    animation:latido 1.4s infinite;
}

.instruccion{
    position:absolute;
    bottom:35px;
    left:50%;
    transform:translateX(-50%);
    color:#74555a;
    font-size:15px;
    animation:pulso 2s infinite alternate;
}

@keyframes flotar{
    0%,100%{transform:translateY(0) rotate(0)}
    50%{transform:translateY(-9px) rotate(1deg)}
}

@keyframes latido{
    0%,100%{transform:translate(-50%,-50%) scale(1)}
    50%{transform:translate(-50%,-50%) scale(1.15)}
}

@keyframes pulso{
    from{opacity:.5}
    to{opacity:1}
}

/* CARTA */
.carta{
    position:fixed;
    z-index:20;
    width:min(88vw,600px);
    height:min(82vh,720px);
    padding:50px 45px;

    background:
        repeating-linear-gradient(
            0deg,
            rgba(120,90,50,.025) 0,
            rgba(120,90,50,.025) 1px,
            transparent 1px,
            transparent 5px
        ),
        #fffdf4;

    box-shadow:
        0 30px 70px rgba(0,0,0,.32),
        inset 0 0 45px rgba(130,100,60,.08);

    clip-path:polygon(
        1% 1%,99% 0%,100% 98%,
        98% 100%,1% 99%,0% 3%
    );

    opacity:0;
    pointer-events:none;

    transform:
        perspective(1200px)
        rotateX(-85deg)
        rotateY(8deg)
        translateY(80px)
        scale(.7);

    transform-origin:top center;

    transition:
        transform 1.2s cubic-bezier(.2,.8,.2,1),
        opacity .5s ease;
}

.carta.abierta{
    opacity:1;
    pointer-events:auto;
    transform:
        perspective(1200px)
        rotateX(0)
        rotateY(0)
        translateY(0)
        scale(1);
}

/* pequeño pliegue */
.carta:before{
    content:"";
    position:absolute;
    left:0;
    right:0;
    top:0;
    height:30%;
    background:linear-gradient(
        to bottom,
        rgba(100,70,40,.06),
        transparent
    );
    opacity:.45;
    pointer-events:none;
}

.texto{
    position:relative;
    z-index:2;
    color:#443838;
    font-family:
        "Segoe Print",
        "Bradley Hand",
        cursive;
    font-size:clamp(15px,2.5vw,20px);
    line-height:1.75;
    white-space:pre-line;
}

.firma{
    position:absolute;
    right:35px;
    bottom:22px;
    color:#624848;
    font-family:
        "Segoe Print",
        "Bradley Hand",
        cursive;
    font-size:17px;
    transform:rotate(-4deg);
}

/* MÓVIL */
@media(max-width:500px){
    .sobre{
        width:270px;
        height:170px;
    }

    .tapa{
        border-left-width:135px;
        border-right-width:135px;
        border-top-width:90px;
    }

    .cuerpo:after{
        border-left-width:135px;
        border-right-width:135px;
        border-bottom-width:95px;
    }

    .carta{
        width:90vw;
        height:78vh;
        padding:38px 27px;
    }

    .texto{
        font-size:15px;
        line-height:1.65;
    }

    .firma{
        right:22px;
        bottom:18px;
        font-size:14px;
    }
}
</style>
</head>

<body>

<div class="fondo"></div>

<div class="escena" id="escena">

    <div class="sobre" id="sobre">
        <div class="cuerpo"></div>
        <div class="tapa" id="tapa"></div>
        <div class="corazon" id="corazon">💌</div>
    </div>

    <div class="instruccion" id="instruccion">
        Toca el sobre 💕
    </div>

</div>


<!-- CARTA -->

<div class="carta" id="carta">

    <div class="texto" id="texto"></div>

    <div class="firma">
        Con amor, Daniela 💕
    </div>

</div>


<script>

/* =========================
   NOMBRES DE TUS AUDIOS
========================= */

const archivoMar =
"WhatsApp Audio 2026-09-07 at 10.13.51 PM (1).mpeg";

const archivoPapel =
"WhatsApp Audio 2026-09-17 at 10.13.52 PM.mpeg";


/* =========================
   CREAR AUDIOS
========================= */

const mar = new Audio(encodeURI(archivoMar));
const papel = new Audio(encodeURI(archivoPapel));

mar.loop = true;
mar.volume = 0.12;
papel.volume = 0.8;


/* =========================
   ELEMENTOS
========================= */

const escena = document.getElementById("escena");
const sobre = document.getElementById("sobre");
const tapa = document.getElementById("tapa");
const corazon = document.getElementById("corazon");
const instruccion = document.getElementById("instruccion");
const carta = document.getElementById("carta");
const texto = document.getElementById("texto");

let abierta = false;
let escribiendo = false;


/* =========================
   TU MENSAJE
========================= */

const mensaje = `Ojitos,

sé que no estamos en plan de nada y así, pero quiero dedicarte algo que recuerdes siempre.

No estamos juntas presencialmente, pero no es una excusa para no hacer cosas por la persona que quelessh. 🥰💕

Esto es una pequeña muestra de mi amor por ti.

Sé que tal vez no te sepas expresar y todo eso, pero yo sé que puedo lograr que lo hagas conmigo. Solo se necesita tiempo y mucho, muchooo cariño.

Espero y esto lo disfrutes mucho porque lo hice por muchooo cariño y NO TE SALTES NADA porque aún faltan eeeh. 🫰🏽

Te amo 💕`;


/* =========================
   ABRIR
========================= */

sobre.addEventListener("click",function(){

    if(abierta) return;

    abierta=true;

    sobre.style.animation="none";

    tapa.style.transform="rotateX(180deg)";
    corazon.style.opacity="0";

    instruccion.style.display="none";

    /* papel */

    papel.currentTime=0;
    papel.play().catch(()=>{});

    /* mar */

    mar.currentTime=0;
    mar.play().catch(()=>{});

    /* sacar el sobre */

    setTimeout(()=>{

        escena.style.opacity="0";
        escena.style.pointerEvents="none";

    },600);

    /* mostrar carta */

    setTimeout(()=>{

        carta.classList.add("abierta");

        escribir();

    },700);

});


/* =========================
   ESCRIBIR
========================= */

function escribir(){

    if(escribiendo) return;

    escribiendo=true;

    texto.textContent="";

    let i=0;

    function siguiente(){

        if(i < mensaje.length){

            texto.textContent += mensaje.charAt(i);

            i++;

            setTimeout(siguiente,24);

        }else{

            escribiendo=false;

        }

    }

    siguiente();

}


/* =========================
   CERRAR CON OTRO CLIC
========================= */

carta.addEventListener("click",function(){

    /* mientras se está escribiendo,
       no cerramos accidentalmente */

    if(escribiendo) return;

    carta.classList.remove("abierta");

    mar.pause();

    setTimeout(()=>{

        escena.style.opacity="1";
        escena.style.pointerEvents="auto";

        tapa.style.transform="rotateX(0deg)";
        corazon.style.opacity="1";

        sobre.style.animation=
            "flotar 3s ease-in-out infinite";

        instruccion.style.display="block";

        abierta=false;

    },1000);

});

</script>

</body>
</html>
