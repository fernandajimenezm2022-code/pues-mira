<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Para ti 💌</title>

<style>

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
}

body{
    overflow:hidden;
    font-family:Georgia,serif;

    /* 🌊 TU FONDO */
    background-image:
        linear-gradient(
            rgba(0,0,20,.18),
            rgba(0,0,20,.18)
        ),
        url("WhatsApp%20Image%202026-09-08%20at%2010.16.25%20AM.jpeg");

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
}


/* =========================
   SOBRE
========================= */

.escena{
    width:100%;
    height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    position:relative;
}

.sobre{
    position:relative;

    width:300px;
    height:190px;

    cursor:pointer;

    animation:
        flotar 3s ease-in-out infinite;

    transition:
        opacity .7s ease,
        transform .7s ease;
}

.cuerpo{
    position:absolute;

    inset:0;

    background:
        linear-gradient(
            145deg,
            #fffaf7,
            #e9c9ca
        );

    border-radius:7px;

    box-shadow:
        0 20px 50px rgba(0,0,0,.45);

    overflow:hidden;
}

.cuerpo:after{
    content:"";

    position:absolute;

    left:0;
    bottom:0;

    width:0;
    height:0;

    border-left:
        150px solid transparent;

    border-right:
        150px solid transparent;

    border-bottom:
        105px solid #dfb9bc;
}

.tapa{
    position:absolute;

    left:0;
    top:0;

    width:0;
    height:0;

    border-left:
        150px solid transparent;

    border-right:
        150px solid transparent;

    border-top:
        105px solid #f2d5d5;

    transform-origin:
        top center;

    transition:
        transform 1s ease;

    z-index:6;
}

.corazon{
    position:absolute;

    left:50%;
    top:55%;

    transform:
        translate(-50%,-50%);

    font-size:45px;

    z-index:8;

    animation:
        latido 1.5s infinite;
}

.instruccion{
    position:absolute;

    bottom:32px;
    left:50%;

    transform:
        translateX(-50%);

    color:white;

    font-family:
        "Segoe Print",
        cursive;

    font-size:15px;

    text-shadow:
        0 2px 5px rgba(0,0,0,.7);
}


/* =========================
   ANIMACIONES SOBRE
========================= */

@keyframes flotar{

    0%,100%{
        transform:
            translateY(0)
            rotate(0);
    }

    50%{
        transform:
            translateY(-10px)
            rotate(1deg);
    }

}

@keyframes latido{

    0%,100%{
        transform:
            translate(-50%,-50%)
            scale(1);
    }

    50%{
        transform:
            translate(-50%,-50%)
            scale(1.12);
    }

}


/* =========================
   CARTA
========================= */

.carta{

    position:fixed;

    z-index:20;

    width:min(88vw,600px);

    height:min(82vh,720px);

    padding:
        45px
        40px
        80px;

    background:
        #fffdf4;

    box-shadow:
        0 25px 60px
        rgba(0,0,0,.5);

    border-radius:3px;

    opacity:0;

    pointer-events:none;

    transform:
        translateY(100px)
        scale(.75)
        rotateX(-70deg);

    transform-origin:
        top center;

    transition:
        transform 1.2s ease,
        opacity .5s ease;

    /*
      ESTA VEZ SÍ SE PUEDE BAJAR
    */
    overflow-y:auto;

    /*
      dejamos visible la barra
      para que sepas que hay más texto
    */
}


/* CARTA ABIERTA */

.carta.abierta{

    opacity:1;

    pointer-events:auto;

    transform:
        translateY(0)
        scale(1)
        rotateX(0);
}


/* =========================
   TEXTO
========================= */

.texto{

    color:#403535;

    font-family:
        "Segoe Print",
        "Bradley Hand",
        cursive;

    font-size:
        clamp(15px,2.5vw,20px);

    line-height:1.75;

    white-space:pre-line;

    padding-bottom:70px;
}


/* =========================
   FIRMA
========================= */

.firma{

    position:sticky;

    bottom:0;

    margin-left:auto;

    width:max-content;

    color:#624848;

    font-family:
        "Segoe Print",
        "Bradley Hand",
        cursive;

    font-size:17px;

    transform:
        rotate(-4deg);

    background:#fffdf4;

    padding:5px 10px;
}


/* =========================
   CELULAR
========================= */

@media(max-width:500px){

    .sobre{

        width:270px;
        height:170px;
    }

    .tapa{

        border-left-width:135px;
        border-right-width:135px;
        border-top-width:90px;
    }

    .cuerpo:after{

        border-left-width:135px;
        border-right-width:135px;
        border-bottom-width:95px;
    }

    .carta{

        width:91vw;

        height:80vh;

        padding:
            35px
            27px
            75px;
    }

    .texto{

        font-size:15px;

        line-height:1.7;
    }

    .firma{

        font-size:14px;

        right:15px;
    }

}

</style>
</head>


<body>


<!-- =========================
     SOBRE
========================= -->

<div class="escena" id="escena">

    <div class="sobre" id="sobre">

        <div class="cuerpo"></div>

        <div
            class="tapa"
            id="tapa">
        </div>

        <div
            class="corazon"
            id="corazon">

            💌

        </div>

    </div>


    <div
        class="instruccion"
        id="instruccion">

        Toca el sobre 💕

    </div>

</div>



<!-- =========================
     CARTA
========================= -->

<div
    class="carta"
    id="carta">

    <div
        class="texto"
        id="texto">
    </div>

    <div
        class="firma">

        AMOR, DANIELA 💕

    </div>

</div>



<script>


/* =========================
   ELEMENTOS
========================= */

const escena =
document.getElementById("escena");

const sobre =
document.getElementById("sobre");

const tapa =
document.getElementById("tapa");

const corazon =
document.getElementById("corazon");

const instruccion =
document.getElementById("instruccion");

const carta =
document.getElementById("carta");

const texto =
document.getElementById("texto");


/* =========================
   🌊 AUDIO DEL MAR
========================= */

const archivoMar =
"WhatsApp Audio 2026-09-07 at 10.13.51 PM (1).mpeg";

const mar =
new Audio(
    encodeURI(archivoMar)
);

mar.loop=true;

/*
   MUY BAJITO 🌊
*/
mar.volume=.10;


/* =========================
   💌 MENSAJE
========================= */

const mensaje = `Ojitos,

sé que no estamos en plan de nada y así pero quiero dedicarte algo que recuerdes siempre.

No estamos juntas presencialmente pero no es una excusa para no hacer cosas por la persona que quelessh. 🥰💕

Esto es una pequeña muestra de mi amor por ti.

Sé que tal vez no te sepas expresar y todo eso pero yo sé que puedo lograr que lo hagas conmigo, solo se necesita tiempo y mucho muchooo cariño.

Espero y esto lo disfrutes mucho porque lo hice por muchooo cariño y NO TE SALTES NADA porque aún faltan eeeh. 🫰🏽

Te amo 💕`;


/* =========================
   ESTADO
========================= */

let abierta=false;

let escribiendo=false;


/* =========================
   ABRIR SOBRE
========================= */

sobre.addEventListener(
    "click",
    function(){

        if(abierta)
            return;

        abierta=true;


        /* abrir tapa */

        tapa.style.transform=
            "rotateX(180deg)";


        /* quitar corazón */

        corazon.style.opacity="0";


        /* quitar texto */

        instruccion.style.opacity="0";


        /*
          🌊 INICIAR MAR
        */

        mar.currentTime=0;

        mar.play().catch(
            ()=>{}
        );


        /* desaparecer sobre */

        setTimeout(
            ()=>{

                escena.style.opacity="0";

                escena.style.pointerEvents=
                    "none";

            },
            600
        );


        /* mostrar carta */

        setTimeout(
            ()=>{

                carta.classList.add(
                    "abierta"
                );

                escribir();

            },
            750
        );

    }
);


/* =========================
   ✍️ ESCRITURA
========================= */

function escribir(){

    escribiendo=true;

    texto.textContent="";

    /*
      empezamos arriba
    */

    carta.scrollTop=0;

    let i=0;


    function siguiente(){

        if(i < mensaje.length){

            texto.textContent +=
                mensaje.charAt(i);

            i++;

            setTimeout(
                siguiente,
                25
            );

        }
        else{

            escribiendo=false;

        }

    }


    siguiente();

}


/* =========================
   👆 CERRAR CARTA
========================= */

carta.addEventListener(
    "click",
    function(){

        /*
          Si todavía está escribiendo,
          no la cerramos accidentalmente.
        */

        if(escribiendo)
            return;


        carta.classList.remove(
            "abierta"
        );


        /* detener mar */

        mar.pause();


        setTimeout(
            ()=>{

                escena.style.opacity="1";

                escena.style.pointerEvents=
                    "auto";

                tapa.style.transform=
                    "rotateX(0deg)";

                corazon.style.opacity="1";

                instruccion.style.opacity=".8";

                sobre.style.animation=
                    "flotar 3s ease-in-out infinite";

                abierta=false;

            },
            1000
        );

    }
);

</script>

</body>
</html>
