<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Para ti 💌</title>

<style>

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    font-family:Georgia, serif;
    background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,.8), transparent 25%),
        linear-gradient(135deg,#dff6ff,#fff4e6);
    display:flex;
    justify-content:center;
    align-items:center;
}

/* =========================
   FONDO
========================= */

.fondo{
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
}

.burbujas{
    position:absolute;
    width:100%;
    height:100%;
    background:
        radial-gradient(circle at 15% 20%,rgba(255,255,255,.35),transparent 4%),
        radial-gradient(circle at 80% 30%,rgba(255,255,255,.3),transparent 5%),
        radial-gradient(circle at 40% 80%,rgba(255,255,255,.25),transparent 4%);
}

/* =========================
   SOBRE
========================= */

.contenedor{
    position:relative;
    width:340px;
    height:250px;
    display:flex;
    justify-content:center;
    align-items:center;
    cursor:pointer;
    z-index:10;
}

.sobre{
    position:relative;
    width:300px;
    height:190px;
    background:linear-gradient(145deg,#fffafa,#f1dada);
    border-radius:5px;
    box-shadow:
        0 20px 40px rgba(0,0,0,.18),
        inset 0 0 20px rgba(255,255,255,.7);
    transition:transform .8s ease;
    animation:flotar 3s ease-in-out infinite;
}

/* parte frontal */

.sobre::after{
    content:"";
    position:absolute;
    left:0;
    bottom:0;
    width:0;
    height:0;
    border-left:150px solid transparent;
    border-right:150px solid transparent;
    border-bottom:100px solid #e8c6c6;
}

/* lados */

.sobre::before{
    content:"";
    position:absolute;
    inset:0;
    background:
        linear-gradient(145deg,transparent 49%,rgba(190,150,150,.35) 50%,transparent 51%),
        linear-gradient(215deg,transparent 49%,rgba(190,150,150,.35) 50%,transparent 51%);
    border-radius:5px;
}

/* tapa del sobre */

.tapa{
    position:absolute;
    top:0;
    left:0;
    width:0;
    height:0;
    border-left:150px solid transparent;
    border-right:150px solid transparent;
    border-top:100px solid #f5dddd;
    transform-origin:top center;
    transition:transform 1s ease;
    z-index:5;
    filter:drop-shadow(0 3px 2px rgba(0,0,0,.08));
}

/* corazón */

.corazon{
    position:absolute;
    z-index:7;
    left:50%;
    top:53%;
    transform:translate(-50%,-50%);
    font-size:45px;
    filter:drop-shadow(0 5px 5px rgba(0,0,0,.15));
    transition:opacity .4s ease;
}

/* movimiento del sobre */

@keyframes flotar{

    0%,100%{
        transform:translateY(0) rotate(0deg);
    }

    50%{
        transform:translateY(-9px) rotate(1deg);
    }

}

/* =========================
   CARTA
========================= */

.carta{
    position:fixed;
    z-index:30;

    width:min(88vw,600px);
    height:min(82vh,720px);

    background:
        linear-gradient(rgba(255,255,255,.25),rgba(255,255,255,.25)),
        repeating-linear-gradient(
            0deg,
            rgba(120,80,40,.025) 0px,
            rgba(120,80,40,.025) 1px,
            transparent 1px,
            transparent 4px
        ),
        #fffdf5;

    box-shadow:
        0 30px 70px rgba(0,0,0,.35),
        inset 0 0 45px rgba(150,120,80,.08);

    padding:55px 50px;

    opacity:0;
    pointer-events:none;

    transform:
        perspective(1200px)
        rotateX(-80deg)
        rotateY(8deg)
        translateY(80px)
        scale(.75);

    transform-origin:top center;

    transition:
        transform 1.2s cubic-bezier(.2,.8,.2,1),
        opacity .5s ease;

    overflow:hidden;

    /* borde ligeramente irregular */
    clip-path:polygon(
        1% 1%,
        99% 0%,
        100% 99%,
        0% 100%,
        0% 3%
    );
}

.carta.abierta{

    opacity:1;

    pointer-events:auto;

    transform:
        perspective(1200px)
        rotateX(0deg)
        rotateY(0deg)
        translateY(0)
        scale(1);

}

/* textura del papel */

.carta::before{

    content:"";

    position:absolute;
    inset:0;

    pointer-events:none;

    background:
        radial-gradient(
            circle at 20% 30%,
            rgba(120,90,50,.07),
            transparent 18%
        ),
        radial-gradient(
            circle at 80% 70%,
            rgba(120,90,50,.05),
            transparent 20%
        );

}

/* =========================
   TEXTO
========================= */

.texto{

    position:relative;

    width:100%;
    height:100%;

    color:#443838;

    font-family:
        "Segoe Print",
        "Bradley Hand",
        "Comic Sans MS",
        cursive;

    font-size:clamp(15px,2.5vw,21px);

    line-height:1.8;

    text-align:left;

    white-space:pre-line;

}

/* firma */

.firma{

    position:absolute;

    right:20px;
    bottom:10px;

    font-size:clamp(14px,2vw,18px);

    font-family:
        "Segoe Print",
        "Bradley Hand",
        cursive;

    transform:rotate(-4deg);

    color:#624848;

}

/* =========================
   MENSAJE INICIAL
========================= */

.instruccion{

    position:absolute;

    bottom:35px;

    left:50%;

    transform:translateX(-50%);

    color:#704f55;

    font-family:
        "Segoe Print",
        cursive;

    font-size:16px;

    text-align:center;

    animation:pulso 2s infinite;

}

@keyframes pulso{

    0%,100%{
        opacity:.55;
    }

    50%{
        opacity:1;
    }

}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:500px){

    .sobre{
        width:270px;
        height:170px;
    }

    .tapa{
        border-left-width:135px;
        border-right-width:135px;
        border-top-width:90px;
    }

    .sobre::after{
        border-left-width:135px;
        border-right-width:135px;
        border-bottom-width:90px;
    }

    .carta{

        width:90vw;
        height:78vh;

        padding:40px 28px;

    }

    .texto{

        font-size:15px;
        line-height:1.65;

    }

}

/* ocultar sobre */

.oculto{

    opacity:0;
    pointer-events:none;

}

</style>
</head>

<body>

<div class="fondo">
    <div class="burbujas"></div>
</div>

<!-- SOBRE -->

<div class="contenedor" id="contenedor">

    <div class="sobre" id="sobre">

        <div class="tapa" id="tapa"></div>

        <div class="corazon" id="corazon">
            💌
        </div>

    </div>

</div>

<div class="instruccion" id="instruccion">
    Toca el sobre 💕
</div>


<!-- CARTA -->

<div class="carta" id="carta">

    <div class="texto" id="texto"></div>

    <div class="firma">
        Con amor, Daniela 💕
    </div>

</div>


<!-- AUDIOS -->

<audio id="mar" loop preload="auto">
    <source src="mar.mp3" type="audio/mpeg">
</audio>

<audio id="papel" preload="auto">
    <source src="papel.mp3" type="audio/mpeg">
</audio>


<script>

const contenedor = document.getElementById("contenedor");
const sobre = document.getElementById("sobre");
const tapa = document.getElementById("tapa");
const carta = document.getElementById("carta");
const texto = document.getElementById("texto");
const corazon = document.getElementById("corazon");
const instruccion = document.getElementById("instruccion");

const mar = document.getElementById("mar");
const papel = document.getElementById("papel");

let abierta = false;
let escribiendo = false;


/* =========================
   MENSAJE
========================= */

const mensaje = `Ojitos,

sé que no estamos en plan de nada y así, pero quiero dedicarte algo que recuerdes siempre.

No estamos juntas presencialmente, pero no es una excusa para no hacer cosas por la persona que quelessh. 🥰💕

Esto es una pequeña muestra de mi amor por ti.

Sé que tal vez no te sepas expresar y todo eso, pero yo sé que puedo lograr que lo hagas conmigo. Solo se necesita tiempo y mucho, muchooo cariño.

Espero y esto lo disfrutes mucho porque lo hice por muchooo cariño y NO TE SALTES NADA porque aún faltan eeeh. 🫰🏽

Te amo 💕`;


/* =========================
   ABRIR CARTA
========================= */

contenedor.addEventListener("click", function(e){

    if(abierta) return;

    abierta = true;

    /* detener animación */

    sobre.style.animation = "none";

    /* abrir tapa */

    tapa.style.transform = "rotateX(180deg)";

    /* quitar corazón */

    corazon.style.opacity = "0";

    /* sonido del papel */

    papel.currentTime = 0;

    papel.volume = 0.8;

    papel.play().catch(()=>{});

    /* sonido del mar */

    mar.volume = 0.12;

    mar.play().catch(()=>{});

    /* desaparecer sobre */

    setTimeout(()=>{

        contenedor.classList.add("oculto");

    },700);


    /* aparecer carta */

    setTimeout(()=>{

        carta.classList.add("abierta");

        instruccion.style.display="none";

        escribir();

    },500);

});


/* =========================
   ESCRITURA
========================= */

function escribir(){

    if(escribiendo) return;

    escribiendo=true;

    texto.innerHTML="";

    let i=0;

    function escribirCaracter(){

        if(i < mensaje.length){

            texto.textContent += mensaje.charAt(i);

            i++;

            setTimeout(escribirCaracter,22);

        }else{

            escribiendo=false;

        }

    }

    escribirCaracter();

}


/* =========================
   CERRAR CON OTRO CLIC
========================= */

carta.addEventListener("click", function(){

    if(escribiendo) return;

    carta.classList.remove("abierta");

    mar.pause();

    setTimeout(()=>{

        contenedor.classList.remove("oculto");

        sobre.style.animation = "flotar 3s ease-in-out infinite";

        tapa.style.transform = "rotateX(0deg)";

        corazon.style.opacity = "1";

        instruccion.style.display="block";

        abierta=false;

    },1000);

});

</script>

</body>
</html>
